name: .NET CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore PlanService.sln
      - run: dotnet build PlanService.sln --configuration Release
      - run: dotnet test PlanService.sln --verbosity normal